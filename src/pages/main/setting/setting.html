<!-- Header -->
<div class="mb-8">
  <h2 class="text-3xl font-bold text-gray-900">
    Settings
  </h2>

  <p class="text-gray-500 mt-2">
    Manage your account, security, preferences, and shopping experience.
  </p>
</div>


<section class="space-y-8">


  <!-- Profile Information -->
  <div class="bg-white border border-gray-200 rounded-2xl p-6">

    <div class="flex items-center gap-5 mb-8">

      <div
        class="w-20 h-20 rounded-full bg-orange-100 flex items-center justify-center text-4xl">
        👤
      </div>

      <div>
        <h3 class="text-xl font-bold text-gray-900">
          Profile Information
        </h3>

        <p class="text-gray-500 text-sm">
          Update your personal information.
        </p>
      </div>

    </div>


    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">


      <div>
        <label class="text-sm font-medium text-gray-700">
          Full Name
        </label>

        <input
          type="text"
          placeholder="Your name"
          class="mt-2 w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 outline-none">
      </div>



      <div>
        <label class="text-sm font-medium text-gray-700">
          Email Address
        </label>

        <input
          type="email"
          placeholder="example@email.com"
          class="mt-2 w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 outline-none">
      </div>



      <div>
        <label class="text-sm font-medium text-gray-700">
          Phone Number
        </label>

        <input
          type="text"
          placeholder="+855"
          class="mt-2 w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 outline-none">
      </div>



      <div>
        <label class="text-sm font-medium text-gray-700">
          Address
        </label>

        <input
          type="text"
          placeholder="Your address"
          class="mt-2 w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 outline-none">
      </div>


    </div>


    <button
      class="mt-6 bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-xl">
      Save Changes
    </button>

  </div>




  <!-- Security -->
  <div class="bg-white border border-gray-200 rounded-2xl p-6">


    <h3 class="text-xl font-bold text-gray-900">
      Security
    </h3>

    <p class="text-gray-500 text-sm mt-1 mb-6">
      Protect your account with a strong password.
    </p>


    <div class="space-y-5">


      <input
        type="password"
        placeholder="Current Password"
        class="w-full px-4 py-3 rounded-xl border border-gray-200">


      <input
        type="password"
        placeholder="New Password"
        class="w-full px-4 py-3 rounded-xl border border-gray-200">


      <input
        type="password"
        placeholder="Confirm Password"
        class="w-full px-4 py-3 rounded-xl border border-gray-200">


    </div>


    <button
      class="mt-6 bg-gray-900 hover:bg-gray-800 text-white px-6 py-3 rounded-xl">
      Update Password
    </button>


  </div>
  <!-- Address Management -->
  <div class="bg-white border border-gray-200 rounded-2xl p-6">
    <h3 class="text-xl font-bold text-gray-900 mb-5">
      Delivery Addresses
    </h3>
    <div class="p-5 rounded-xl bg-gray-50 border">
      <h4 class="font-bold">
        Home Address
      </h4>
      <p class="text-gray-500 mt-2">
        Phnom Penh, Cambodia
      </p>
      <button
        class="mt-4 text-orange-500">
        Edit Address
      </button>
    </div>
  </div>
  <!-- Account Actions -->
  <div class="bg-white border border-red-200 rounded-2xl p-6">
    <h3 class="text-xl font-bold text-red-600">
      Account Actions
    </h3>
    <p class="text-gray-500 mt-2">
      Manage your account status.
    </p>
    <div class="flex flex-wrap gap-4 mt-6">
      <button
        class="px-6 py-3 rounded-xl border border-gray-300">
        Logout
      </button>
      <button
        class="px-6 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white">
        Delete Account
      </button>
    </div>
  </div>
</section>
