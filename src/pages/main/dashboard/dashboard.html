<app-banner></app-banner>

<div class="mb-6 md:mb-8 px-2 sm:px-0">
  <!-- Header -->
  <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
    <div>
      <h2 class="text-2xl sm:text-3xl font-bold text-gray-900">Featured Products</h2>

      <p class="text-gray-500 mt-1 text-sm sm:text-base">Explore our latest products.</p>
    </div>

    <!-- Filter -->
    <select (change)="onFilterChange($event)"
      class="w-full sm:w-auto px-4 py-2.5 border rounded-xl border-gray-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <option value="popular">Most Popular</option>
      <option value="low-high">Price: Low to High</option>
      <option value="high-low">Price: High to Low</option>
    </select>
  </div>
</div>

<!-- Products -->
<section
  class="grid grid-cols-1 xs:grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6 px-2 sm:px-0">
  @for (product of products; track product.productId) {
  <app-product-cart [product]="product"></app-product-cart>
  } @empty {
  <p class="text-gray-500 col-span-full text-center py-10">No products found.</p>
  }
</section>

<!-- Pagination -->
<div class="mt-8 sm:mt-10 px-2 sm:px-0 overflow-x-auto">
  <app-pagination></app-pagination>
</div>
