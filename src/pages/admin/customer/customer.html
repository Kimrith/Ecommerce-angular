<div class="space-y-6">
  <!-- Header -->
  <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">

    <div>
      <h1 class="text-3xl font-bold text-slate-900">
        Customers
      </h1>

      <p class="mt-1 text-slate-500">
        Manage customer accounts and activity.
      </p>
    </div>

  </div>

  <!-- Stats -->
  <div class="grid gap-6 md:grid-cols-3">

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-sm text-slate-500">
        Total Customers
      </p>

      <h2 class="mt-2 text-3xl font-bold text-slate-900">
        12,540
      </h2>
    </div>


    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-sm text-slate-500">
        Active Customers
      </p>

      <h2 class="mt-2 text-3xl font-bold text-green-600">
        11,820
      </h2>
    </div>


    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-sm text-slate-500">
        Blocked Customers
      </p>

      <h2 class="mt-2 text-3xl font-bold text-red-600">
        45
      </h2>
    </div>

  </div>

  <!-- Search -->
  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">

    <div class="flex flex-col gap-4 md:flex-row">

      <input
        type="text"
        placeholder="Search customer..."
        class="flex-1 rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-orange-500">

      <button
        class="rounded-xl bg-orange-500 px-6 py-3 font-semibold text-white hover:bg-orange-600">
        Search
      </button>

    </div>

  </div>

  <!-- Customer Table -->
  <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

    <table class="min-w-full">

      <thead class="bg-slate-50">

        <tr>

          <th class="px-6 py-3 text-left text-sm font-semibold text-slate-500">
            Customer
          </th>

          <th class="px-6 py-3 text-left text-sm font-semibold text-slate-500">
            Email
          </th>

          <th class="px-6 py-3 text-left text-sm font-semibold text-slate-500">
            Orders
          </th>

          <th class="px-6 py-3 text-left text-sm font-semibold text-slate-500">
            Status
          </th>

          <th class="px-6 py-3 text-left text-sm font-semibold text-slate-500">
            Action
          </th>

        </tr>

      </thead>


      <tbody class="divide-y divide-slate-100">
        <tr>

          <td class="px-6 py-4">

            <div class="flex items-center gap-3">

              <div class="flex h-10 w-10 items-center justify-center rounded-full bg-orange-100 font-bold text-orange-600">
                JD
              </div>

              <span class="font-medium text-slate-900">
                John Doe
              </span>

            </div>

          </td>


          <td class="px-6 py-4 text-slate-600">
            john@example.com
          </td>


          <td class="px-6 py-4 text-slate-600">
            24
          </td>


          <td class="px-6 py-4">

            <span class="rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700">
              Active
            </span>

          </td>
          <td class="px-6 py-4">

            <button
              class="rounded-lg bg-slate-900 px-4 py-2 text-sm text-white hover:bg-slate-800">
              View
            </button>

          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
