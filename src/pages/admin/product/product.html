<div class="space-y-6">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold text-slate-900">Products</h1>
      <p class="text-slate-500 mt-1">Manage all products from sellers.</p>
    </div>
    <button class="px-5 py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-semibold transition">
      + Add Product
    </button>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
    <div class="flex flex-col md:flex-row gap-4">
      <input type="text" placeholder="Search product..." class="flex-1 px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-orange-500">
      <select class="px-4 py-3 rounded-xl border border-slate-200 outline-none">
        <option>All Categories</option>
        <option>Electronics</option>
        <option>Fashion</option>
        <option>Home</option>
      </select>
      <select class="px-4 py-3 rounded-xl border border-slate-200 outline-none">
        <option>All Status</option>
        <option>Active</option>
        <option>Pending</option>
        <option>Blocked</option>
      </select>
      <button class="px-5 py-3 bg-slate-900 text-white rounded-xl hover:bg-slate-800">
        Search
      </button>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-slate-50 border-b border-slate-200">
          <tr>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Product</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Seller</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Category</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Price</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Stock</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Status</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Action</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-slate-100">
          <tr>
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <img src="https://via.placeholder.com/50" class="w-12 h-12 rounded-xl object-cover">
                <div>
                  <p class="font-semibold text-slate-900">iPhone 15 Pro</p>
                  <p class="text-sm text-slate-500">SKU: IP15-001</p>
                </div>
              </div>
            </td>

            <td class="px-6 py-4 text-slate-700">
              Tech Store
            </td>

            <td class="px-6 py-4 text-slate-700">
              Electronics
            </td>

            <td class="px-6 py-4 font-semibold text-slate-900">
              $999
            </td>

            <td class="px-6 py-4 text-slate-700">
              25
            </td>

            <td class="px-6 py-4">
              <span class="px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700">
                Active
              </span>
            </td>

            <td class="px-6 py-4">
              <div class="flex gap-2">
                <button class="px-3 py-2 rounded-lg bg-blue-600 text-white text-sm hover:bg-blue-700">
                  View
                </button>
                <button class="px-3 py-2 rounded-lg bg-red-600 text-white text-sm hover:bg-red-700">
                  Disable
                </button>
              </div>
            </td>
          </tr>

          <tr>
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <img src="https://via.placeholder.com/50" class="w-12 h-12 rounded-xl object-cover">
                <div>
                  <p class="font-semibold text-slate-900">Gaming Keyboard</p>
                  <p class="text-sm text-slate-500">SKU: KB-100</p>
                </div>
              </div>
            </td>

            <td class="px-6 py-4 text-slate-700">
              Gaming Store
            </td>

            <td class="px-6 py-4 text-slate-700">
              Accessories
            </td>

            <td class="px-6 py-4 font-semibold text-slate-900">
              $120
            </td>

            <td class="px-6 py-4 text-slate-700">
              50
            </td>

            <td class="px-6 py-4">
              <span class="px-3 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-700">
                Pending
              </span>
            </td>

            <td class="px-6 py-4">
              <div class="flex gap-2">
                <button class="px-3 py-2 rounded-lg bg-green-600 text-white text-sm">
                  Approve
                </button>
                <button class="px-3 py-2 rounded-lg bg-red-600 text-white text-sm">
                  Reject
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
