<div class="space-y-6">
  <!-- Header -->
  <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
    <div>
      <h1 class="text-3xl font-bold text-slate-900">Sellers</h1>

      <p class="mt-1 text-slate-500">Manage seller accounts and store approvals.</p>
    </div>

    <button
      (click)="openAddSellerModal()"
      class="rounded-xl bg-orange-500 px-5 py-3 font-semibold cursor-pointer text-white hover:bg-orange-600"
    >
      + Add Seller
    </button>
  </div>

  @if (showAddSellerModal) {
    <app-add-seller-form-model (close)="closeAddSellerModal()"> </app-add-seller-form-model>
  }

  <!-- Statistics -->
  <div class="grid gap-6 md:grid-cols-4">
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-sm text-slate-500">Total Sellers</p>

      <h2 class="mt-2 text-3xl font-bold text-slate-900">325</h2>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-sm text-slate-500">Active Sellers</p>

      <h2 class="mt-2 text-3xl font-bold text-green-600">280</h2>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-sm text-slate-500">Pending Approval</p>

      <h2 class="mt-2 text-3xl font-bold text-orange-500">18</h2>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-sm text-slate-500">Suspended</p>

      <h2 class="mt-2 text-3xl font-bold text-red-600">27</h2>
    </div>
  </div>

  <!-- Search -->
  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="flex flex-col gap-4 md:flex-row">
      <input
        type="text"
        placeholder="Search seller or store..."
        class="flex-1 rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-orange-500"
      />

      <button class="rounded-xl bg-slate-900 px-6 py-3 text-white hover:bg-slate-800">
        Search
      </button>
    </div>
  </div>

  <!-- Seller Table -->
  <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <table class="min-w-full">
      <thead class="bg-slate-50">
        <tr>
          <th class="px-6 py-3 text-left text-sm font-semibold text-slate-500">Store</th>

          <th class="px-6 py-3 text-left text-sm font-semibold text-slate-500">Owner</th>

          <th class="px-6 py-3 text-left text-sm font-semibold text-slate-500">Products</th>

          <th class="px-6 py-3 text-left text-sm font-semibold text-slate-500">Status</th>

          <th class="px-6 py-3 text-left text-sm font-semibold text-slate-500">Action</th>
        </tr>
      </thead>

      <tbody class="divide-y divide-slate-100">
        <tr>
          <td class="px-6 py-4">
            <div class="flex items-center gap-3">
              <div
                class="flex h-12 w-12 items-center justify-center rounded-xl bg-orange-100 font-bold text-orange-600"
              >
                KS
              </div>

              <div>
                <p class="font-semibold text-slate-900">Kimrith Store</p>

                <p class="text-sm text-slate-500">Electronics</p>
              </div>
            </div>
          </td>

          <td class="px-6 py-4 text-slate-600">John Seller</td>

          <td class="px-6 py-4 text-slate-600">120</td>

          <td class="px-6 py-4">
            <span class="rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700">
              Active
            </span>
          </td>

          <td class="px-6 py-4">
            <div class="flex gap-2">
              <button class="rounded-lg bg-blue-600 px-3 py-2 text-sm text-white hover:bg-blue-700">
                View
              </button>

              <button class="rounded-lg bg-red-600 px-3 py-2 text-sm text-white hover:bg-red-700">
                Suspend
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
