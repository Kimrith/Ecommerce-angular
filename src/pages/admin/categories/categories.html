<div class="space-y-6">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold text-slate-900">Categories</h1>
      <p class="text-slate-500 mt-1">Manage product categories across the platform.</p>
    </div>

    <button class="px-5 py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-semibold transition">
      + Add Category
    </button>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
    <div class="flex flex-col md:flex-row gap-4">
      <input type="text" placeholder="Search category..." class="flex-1 px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-orange-500">

      <button class="px-5 py-3 bg-slate-900 text-white rounded-xl hover:bg-slate-800">
        Search
      </button>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-slate-50 border-b border-slate-200">
          <tr>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Category</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Products</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Created Date</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Status</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Action</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-slate-100">
          <tr>
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <img src="https://via.placeholder.com/50" class="w-12 h-12 rounded-xl object-cover">

                <div>
                  <p class="font-semibold text-slate-900">
                    Electronics
                  </p>

                  <p class="text-sm text-slate-500">
                    electronics
                  </p>
                </div>
              </div>
            </td>

            <td class="px-6 py-4 text-slate-700">
              350 Products
            </td>

            <td class="px-6 py-4 text-slate-700">
              Jan 10, 2026
            </td>

            <td class="px-6 py-4">
              <span class="px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700">
                Active
              </span>
            </td>

            <td class="px-6 py-4">
              <div class="flex gap-2">
                <button class="px-3 py-2 rounded-lg bg-blue-600 text-white text-sm hover:bg-blue-700">
                  Edit
                </button>

                <button class="px-3 py-2 rounded-lg bg-red-600 text-white text-sm hover:bg-red-700">
                  Delete
                </button>
              </div>
            </td>
          </tr>

          <tr>
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <img src="https://via.placeholder.com/50" class="w-12 h-12 rounded-xl object-cover">

                <div>
                  <p class="font-semibold text-slate-900">
                    Fashion
                  </p>

                  <p class="text-sm text-slate-500">
                    fashion
                  </p>
                </div>
              </div>
            </td>

            <td class="px-6 py-4 text-slate-700">
              210 Products
            </td>

            <td class="px-6 py-4 text-slate-700">
              Feb 02, 2026
            </td>

            <td class="px-6 py-4">
              <span class="px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700">
                Active
              </span>
            </td>

            <td class="px-6 py-4">
              <div class="flex gap-2">
                <button class="px-3 py-2 rounded-lg bg-blue-600 text-white text-sm">
                  Edit
                </button>

                <button class="px-3 py-2 rounded-lg bg-red-600 text-white text-sm">
                  Delete
                </button>
              </div>
            </td>
          </tr>

        </tbody>
      </table>
    </div>
  </div>
</div>
