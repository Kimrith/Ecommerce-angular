<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">

  <!-- Table Header -->
  <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
    <div>
      <h2 class="text-lg font-semibold text-slate-900">
        All Orders
      </h2>
      <p class="text-sm text-slate-500">
        Manage customer orders and update their status.
      </p>
    </div>

    <div>
      <input
        type="text"
        placeholder="Search orders..."
        class="w-64 rounded-lg border border-slate-300 px-4 py-2 text-sm focus:border-blue-500 focus:ring focus:ring-blue-200" />
    </div>
  </div>

  <!-- Table -->
  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-slate-200">
      <thead class="bg-slate-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">
            Order ID
          </th>

          <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">
            Customer
          </th>

          <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">
            Date
          </th>

          <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">
            Total
          </th>

          <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">
            Payment
          </th>

          <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">
            Status
          </th>

          <th class="px-6 py-3 text-center text-xs font-semibold uppercase text-slate-500">
            Actions
          </th>
        </tr>
      </thead>

      <tbody class="divide-y divide-slate-100 bg-white">

        <tr class="hover:bg-slate-50">
          <td class="px-6 py-4 font-medium text-slate-900">#ORD-1001</td>
          <td class="px-6 py-4">John Doe</td>
          <td class="px-6 py-4">23 Jul 2026</td>
          <td class="px-6 py-4">$249.99</td>

          <td class="px-6 py-4">
            <span class="rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700">
              Paid
            </span>
          </td>

          <td class="px-6 py-4">
            <span class="rounded-full bg-yellow-100 px-3 py-1 text-xs font-semibold text-yellow-700">
              Processing
            </span>
          </td>

          <td class="px-6 py-4">
            <div class="flex justify-center gap-2">
              <button class="rounded-lg bg-blue-600 px-3 py-1 text-sm text-white hover:bg-blue-700">
                View
              </button>

              <button class="rounded-lg bg-slate-200 px-3 py-1 text-sm hover:bg-slate-300">
                Edit
              </button>
            </div>
          </td>
        </tr>

        <tr class="hover:bg-slate-50">
          <td class="px-6 py-4 font-medium text-slate-900">#ORD-1002</td>
          <td class="px-6 py-4">Jane Smith</td>
          <td class="px-6 py-4">22 Jul 2026</td>
          <td class="px-6 py-4">$89.50</td>

          <td class="px-6 py-4">
            <span class="rounded-full bg-red-100 px-3 py-1 text-xs font-semibold text-red-700">
              Pending
            </span>
          </td>

          <td class="px-6 py-4">
            <span class="rounded-full bg-blue-100 px-3 py-1 text-xs font-semibold text-blue-700">
              Shipped
            </span>
          </td>

          <td class="px-6 py-4">
            <div class="flex justify-center gap-2">
              <button class="rounded-lg bg-blue-600 px-3 py-1 text-sm text-white hover:bg-blue-700">
                View
              </button>

              <button class="rounded-lg bg-slate-200 px-3 py-1 text-sm hover:bg-slate-300">
                Edit
              </button>
            </div>
          </td>
        </tr>

      </tbody>
    </table>
  </div>

</div>
