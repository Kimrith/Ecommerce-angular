<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">

  <!-- Modal -->
  <div class="w-full max-w-3xl rounded-2xl bg-white shadow-xl">
    <form (ngSubmit)="postProductSeller()" #productForm="ngForm">
      <!-- Header -->
      <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4">

        <div>
          <h2 class="text-xl font-bold text-slate-900">
            {{ editProduct ? 'Edit Product' : 'Add Product' }}
          </h2>

          <p class="text-sm text-slate-500">
            {{ editProduct ? 'Update the details of your store product.' : 'Create a new product for your store.' }}
          </p>
        </div>

        <button type="button" (click)="closeModal()" class="text-2xl text-slate-400 hover:text-slate-700">
          &times;
        </button>

      </div>

      <!-- Form Body -->
      <div class="space-y-6 p-6">
        <!-- Product Image -->
        <div>
          <label class="mb-2 block text-sm font-medium text-slate-700">
            Product Image
          </label>

          <div
            class="flex h-40 items-center justify-center rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 relative overflow-hidden">
            @if (imagePreview) {
            <img [src]="imagePreview" class="absolute inset-0 w-full h-full object-cover" alt="Product preview" />
            <button type="button" (click)="removeImage()"
              class="absolute top-2 right-2 rounded-full bg-red-600 p-2 text-white hover:bg-red-700 shadow-md">
              &times;
            </button>
            } @else {
            <div class="text-center">
              <p class="text-sm text-slate-500 mb-2">Select a product image</p>
              <button type="button" (click)="fileInput.click()"
                class="rounded-lg bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">
                Upload Image
              </button>
            </div>
            }
            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" class="hidden" />
          </div>
        </div>

        <!-- Product Info -->
        <div class="grid gap-6 md:grid-cols-2">
          <div>
            <label class="mb-2 block text-sm font-medium text-slate-700">
              Product Name *
            </label>

            <input type="text" [(ngModel)]="product.name" name="name" required placeholder="Enter product name"
              class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:border-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="mb-2 block text-sm font-medium text-slate-700">
              Category *
            </label>

            <select [(ngModel)]="product.categoryId" name="categoryId" required
              class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:border-blue-500 focus:outline-none">
              <option value="" disabled>Select a category</option>
              @for (cat of categories; track cat.id) {
              <option [value]="cat.id">{{ cat.name }}</option>
              } @empty {
              <option disabled value="">No categories available</option>
              }
            </select>
          </div>
        </div>

        <!-- Price & Stock -->
        <div class="grid gap-6 md:grid-cols-3">
          <div>
            <label class="mb-2 block text-sm font-medium text-slate-700">
              Price *
            </label>

            <input type="number" [(ngModel)]="product.price" name="price" required min="0.01" placeholder="$0.00"
              class="w-full rounded-lg border border-slate-300 px-4 py-2">
          </div>
          <div>
            <label class="mb-2 block text-sm font-medium text-slate-700">
              Stock *
            </label>

            <input type="number" [(ngModel)]="product.stock" name="stock" required min="0" placeholder="Quantity"
              class="w-full rounded-lg border border-slate-300 px-4 py-2">
          </div>

          <div>
            <label class="mb-2 block text-sm font-medium text-slate-700">
              SKU
            </label>

            <input type="text" [(ngModel)]="product.sku" name="sku" placeholder="SKU-001"
              class="w-full rounded-lg border border-slate-300 px-4 py-2">
          </div>
        </div>

        <!-- Color & Size -->
        <div class="grid gap-6 md:grid-cols-2">
          <div>
            <label class="mb-2 block text-sm font-medium text-slate-700">
              Color
            </label>

            <input type="text" [(ngModel)]="product.color" name="color" placeholder="e.g. Black, White, Red"
              class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:border-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="mb-2 block text-sm font-medium text-slate-700">
              Size
            </label>

            <input type="text" [(ngModel)]="product.size" name="size" placeholder="e.g. S, M, L, XL"
              class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:border-blue-500 focus:outline-none">
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="mb-2 block text-sm font-medium text-slate-700">
            Description
          </label>

          <textarea [(ngModel)]="product.description" name="description" rows="4" placeholder="Product description..."
            class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:border-blue-500 focus:outline-none"></textarea>
        </div>

        <!-- Status -->
        <div class="flex items-center gap-3">
          <input type="checkbox" [(ngModel)]="product.publishImmediately" name="publishImmediately"
            id="publishImmediately" class="h-4 w-4 rounded border-slate-300">
          <label for="publishImmediately" class="text-sm text-slate-700 cursor-pointer select-none">
            Publish product immediately
          </label>
        </div>
      </div>

      <!-- Footer -->
      <div class="flex justify-end gap-3 border-t border-slate-200 px-6 py-4">
        <button type="button" (click)="closeModal()"
          class="rounded-lg border border-slate-300 px-5 py-2 text-slate-700 hover:bg-slate-100">
          Cancel
        </button>
        <button type="submit" [disabled]="!productForm.valid"
          class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
          {{ editProduct ? 'Update Product' : 'Save Product' }}
        </button>
      </div>
    </form>
  </div>

  @if (showSuccessToast) {
    <app-toast [message]="toastMessage" (dismissed)="showSuccessToast = false"></app-toast>
  }
</div>
