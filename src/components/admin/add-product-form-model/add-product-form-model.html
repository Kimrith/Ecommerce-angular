<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="w-full max-w-4xl rounded-2xl bg-white shadow-2xl">
    <!-- Header -->
    <div class="flex items-center justify-between border-b px-6 py-5">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">{{ editProduct ? 'Edit Product' : 'Add New Product' }}</h2>
        <p class="mt-1 text-sm text-gray-500">
          {{ editProduct ? 'Update the information below to modify the product.' : 'Fill in the information below to create a new product.' }}
        </p>
      </div>

      <button (click)="closeModal()"
        class="cursor-pointer rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-red-500">
        ✕
      </button>
    </div>

    <!-- Form -->
    <form class="p-6" (ngSubmit)="saveProduct()">
      <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
        <!-- Product Name -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700"> Product Name </label>

          <input [(ngModel)]="product.name" name="name" type="text" placeholder="Nike Air Max"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200" />
        </div>

        <!-- SKU -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700"> SKU </label>

          <input [(ngModel)]="product.sku" name="sku" type="text" placeholder="SKU-10001"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200" />
        </div>

        <!-- Category -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700"> Category </label>

          <select [(ngModel)]="product.categoryId" name="categoryId"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500 outline-none">
            <option value="">Select Category</option>

            @for (category of categories; track category.id) {
            <option [value]="category.id">
              {{ category.name }}
            </option>
            } @empty {
            <option disabled value="">No categories available</option>
            }
          </select>
        </div>

        <!-- Brand -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700"> Brand </label>

          <input [(ngModel)]="product.brand" name="brand" type="text" placeholder="Nike"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200" />
        </div>

        <!-- Price -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700"> Price ($) </label>

          <input [(ngModel)]="product.price" name="price" type="number" placeholder="100"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200" />
        </div>

        <!-- Discount -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700"> Discount ($) </label>

          <input [(ngModel)]="product.discount" name="discount" type="number" placeholder="10"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200" />
        </div>

        <!-- Stock -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700"> Stock Quantity </label>

          <input [(ngModel)]="product.stock" name="stock" type="number" placeholder="50"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200" />
        </div>

        <!-- Status -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700"> Status </label>

          <select [(ngModel)]="product.status" name="status"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500">
            <option [ngValue]="0">Draft</option>
            <option [ngValue]="1">Pending</option>
            <option [ngValue]="2">Approved</option>
            <option [ngValue]="3">Rejected</option>
            <option [ngValue]="4">Archived</option>
            <option [ngValue]="5">Suspended</option>
          </select>
        </div>

        <!-- Color -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700"> Color </label>

          <input [(ngModel)]="product.color" name="color" type="text" placeholder="e.g. Black, White"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200" />
        </div>

        <!-- Size -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700"> Size </label>

          <input [(ngModel)]="product.size" name="size" type="text" placeholder="e.g. S, M, L, XL"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200" />
        </div>
      </div>

      <!-- Description -->
      <div class="mt-5">
        <label class="mb-2 block text-sm font-medium text-gray-700"> Product Description </label>

        <textarea [(ngModel)]="product.description" name="description" rows="4"
          placeholder="Enter product description..."
          class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500">
        </textarea>
      </div>

      <!-- Product Images -->
      <div class="mt-5">
        <label class="mb-2 block text-sm font-medium text-gray-700"> Product Images </label>
        
        <div class="flex items-center gap-4 mb-3" *ngIf="existingImageUrl && !product.images.length">
          <div class="relative w-20 h-20 rounded-xl overflow-hidden border border-gray-200 shadow-sm flex items-center justify-center bg-gray-50 shrink-0">
            <img [src]="'http://localhost:5117' + existingImageUrl" alt="Current Image" class="w-full h-full object-cover">
            <span class="absolute bottom-0 left-0 right-0 bg-black/60 text-[9px] text-white text-center py-0.5 font-medium">Current Image</span>
          </div>
        </div>

        <input type="file" multiple (change)="onFilesSelected($event)"
          class="block w-full cursor-pointer rounded-xl border border-gray-300 p-3 file:mr-4 file:rounded-lg file:border-0 file:bg-orange-500 file:px-4 file:py-2 file:text-white" />
      </div>

      <!-- Footer -->
      <div class="mt-8 flex justify-end gap-3">
        <button type="button" (click)="closeModal()"
          class="cursor-pointer rounded-xl border border-gray-300 px-6 py-3 hover:bg-gray-100">
          Cancel
        </button>

        <button type="submit"
          class="cursor-pointer rounded-xl bg-orange-500 px-6 py-3 font-semibold text-white hover:bg-orange-600">
          {{ editProduct ? 'Update Product' : 'Save Product' }}
        </button>
      </div>
    </form>
  </div>
</div>
