
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">

  <div class="w-full max-w-2xl rounded-2xl bg-white shadow-2xl">

    <!-- Header -->
    <div class="flex items-center justify-between border-b px-6 py-5">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">
          Add New Seller
        </h2>
        <p class="mt-1 text-sm text-gray-500">
          Fill in the information below to create a seller account.
        </p>
      </div>

      <button
        (click)="closeModal()"
        class="cursor-pointer rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-red-500">
        ✕
      </button>
    </div>


    <!-- Form -->
    <form class="p-6" (ngSubmit)="saveSeller()">

      <div class="grid grid-cols-1 gap-5 md:grid-cols-2">

        <!-- Full Name -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700">
            Full Name
          </label>

          <input
            [(ngModel)]="seller.fullName"
            name="fullName"
            type="text"
            placeholder="John Doe"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200">
        </div>


        <!-- Email -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700">
            Email
          </label>

          <input
            [(ngModel)]="seller.email"
            name="email"
            type="email"
            placeholder="seller@example.com"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200">
        </div>


        <!-- Phone -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700">
            Phone Number
          </label>

          <input
            [(ngModel)]="seller.phone"
            name="phone"
            type="text"
            placeholder="+855 12 345 678"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200">
        </div>


        <!-- Password -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700">
            Password
          </label>

          <input
            [(ngModel)]="seller.password"
            name="password"
            type="password"
            placeholder="********"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200">
        </div>


        <!-- Confirm Password -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700">
            Confirm Password
          </label>

          <input
            [(ngModel)]="seller.confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="Confirm password"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200">
        </div>


        <!-- Shop Name -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700">
            Shop Name
          </label>

          <input
            [(ngModel)]="seller.shopName"
            name="shopName"
            type="text"
            placeholder="Kimrith Store"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200">
        </div>


        <!-- Role -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700">
            Role
          </label>

          <input
            [(ngModel)]="seller.role"
            name="role"
            type="text"
            readonly
            class="w-full cursor-not-allowed rounded-xl border border-gray-300 bg-gray-100 px-4 py-3 text-gray-600">
        </div>


        <!-- Status -->
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700">
            Status
          </label>

          <select
            [(ngModel)]="seller.status"
            name="status"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500">

            <option value="Active">Active</option>
            <option value="Pending">Pending Approval</option>
            <option value="Inactive">Inactive</option>

          </select>
        </div>

      </div>


      <!-- Address -->
      <div class="mt-5">
        <label class="mb-2 block text-sm font-medium text-gray-700">
          Address
        </label>

        <textarea
          [(ngModel)]="seller.address"
          name="address"
          rows="4"
          placeholder="Enter seller address..."
          class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500">
        </textarea>
      </div>


      <!-- Profile Image -->
      <div class="mt-5">
        <label class="mb-2 block text-sm font-medium text-gray-700">
          Profile Image
        </label>

        <input
          type="file"
          (change)="onFileSelected($event)"
          class="block w-full cursor-pointer rounded-xl border border-gray-300 p-3 file:mr-4 file:rounded-lg file:border-0 file:bg-orange-500 file:px-4 file:py-2 file:text-white">
      </div>


      <!-- Footer -->
      <div class="mt-8 flex justify-end gap-3">

        <button
          type="button"
          (click)="closeModal()"
          class="cursor-pointer rounded-xl border border-gray-300 px-6 py-3 hover:bg-gray-100">
          Cancel
        </button>

        <button
          type="submit"
          class="cursor-pointer rounded-xl bg-orange-500 px-6 py-3 font-semibold text-white hover:bg-orange-600">
          Save Seller
        </button>

      </div>

    </form>

  </div>

</div>
