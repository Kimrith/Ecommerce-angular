<div class="min-h-screen bg-gray-50">

  <!-- Banner -->
  <section class="relative h-56 md:h-72 rounded-3xl overflow-hidden mb-8">
    @for (img of imgs; track img.id) {
    <img
        [src]="img.img"
        class="w-full h-full object-cover"
        alt="Category">
    }

    <div class="absolute inset-0 bg-black/40"></div>

    <div class="absolute inset-0 flex flex-col justify-center px-6 md:px-12 text-white">
      <p class="text-sm uppercase tracking-widest opacity-80">
        Category
      </p>

      <h1 class="text-3xl md:text-5xl font-bold mt-2">
        Men's Fashion
      </h1>

      <p class="mt-3 max-w-2xl text-white/90">
        Discover the latest fashion trends with premium quality clothing,
        shoes, and accessories.
      </p>
    </div>
  </section>

  <!-- Breadcrumb -->
  <div class="mb-6 text-sm text-gray-500">
    <a routerLink="/" class="hover:text-indigo-600">
      Home
    </a>

    <span class="mx-2">/</span>

    <a routerLink="/categories" class="hover:text-indigo-600">
      Categories
    </a>

    <span class="mx-2">/</span>

    <span class="text-gray-900 font-medium">
      Men's Fashion
    </span>
  </div>

  <!-- Header -->
  <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-8">

    <div>
      <h2 class="text-2xl font-bold text-gray-900">
        Products
      </h2>

      <p class="text-gray-500 mt-1">
        120 products available
      </p>
    </div>

    <select
      class="px-4 py-2 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500">

      <option>Newest</option>
      <option>Most Popular</option>
      <option>Price: Low to High</option>
      <option>Price: High to Low</option>

    </select>

  </div>

  <!-- Products -->
  <section class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">

    <app-product-cart></app-product-cart>
    <app-product-cart></app-product-cart>
    <app-product-cart></app-product-cart>
    <app-product-cart></app-product-cart>

    <app-product-cart></app-product-cart>
    <app-product-cart></app-product-cart>
    <app-product-cart></app-product-cart>
    <app-product-cart></app-product-cart>

  </section>

  <!-- Pagination -->
  <div class="mt-10 flex justify-center">
    <app-pagination></app-pagination>
  </div>

</div>
