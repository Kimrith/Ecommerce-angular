  <div
    class="group bg-white rounded-2xl border border-gray-100 overflow-hidden hover:shadow-xl transition duration-300">

    <div class="bg-gray-100 h-64 flex items-center justify-center">
      Product Image
    </div>

    <div class="p-5">

      <span
        class="text-xs font-semibold uppercase tracking-wider text-orange-500">
        Electronics
      </span>

      <h3 class="mt-2 text-lg font-bold text-gray-900">
        Wireless Headphones
      </h3>

      <p class="text-sm text-gray-500 mt-2">
        Premium noise-cancelling wireless headphones.
      </p>

      <div class="flex justify-between items-center mt-5">

        <span class="text-2xl font-bold text-gray-900">
          $299
        </span>

          <!-- Add Cart Button -->
          <button
            (click)="addToCart()"
            class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-2 rounded-xl transition">

            Add Cart

          </button>

      </div>

    </div>

  </div>
