<div class="flex min-h-[70vh] items-center justify-center px-6">

  <div class="max-w-lg text-center">

    <h1 class="text-8xl font-extrabold text-orange-500">
      404
    </h1>

    <h2 class="mt-4 text-3xl font-bold text-slate-900">
      Page Not Found
    </h2>

    <p class="mt-4 text-slate-500">
      Sorry, the page you're looking for doesn't exist or may have been moved.
    </p>

    <div class="mt-8 flex flex-wrap justify-center gap-4">

      <button
        onclick="history.back()"
        class="rounded-xl border border-slate-300 px-6 py-3 font-semibold text-slate-700 transition hover:bg-slate-100">
        Go Back
      </button>

    </div>

  </div>

</div>
