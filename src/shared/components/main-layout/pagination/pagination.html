<!-- Pagination -->
<div
  class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mt-10 border-t border-gray-200 pt-6"
>
  <!-- Showing Results -->
  <div class="text-sm text-gray-500 text-center sm:text-left whitespace-nowrap">
    Showing
    <span class="font-semibold text-gray-900">{{ startItem }}–{{ endItem }}</span>
    of
    <span class="font-semibold text-gray-900">{{ totalCount }}</span>
    products
  </div>

  <!-- Pagination Buttons -->
  <nav class="flex items-center justify-center gap-2 overflow-x-auto max-w-full">
    <!-- Previous Button -->
    <button
      (click)="onPageChange(pageNumber - 1)"
      [disabled]="pageNumber === 1"
      class="shrink-0 px-3 sm:px-4 py-2 rounded-xl border border-gray-200 text-gray-600 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition text-sm"
    >
      ← <span class="hidden sm:inline">Previous</span>
    </button>

    <!-- Page Number Buttons -->
    @for (page of totalPagesArray; track page) {
      <button
        (click)="onPageChange(page)"
        [class]="
          page === pageNumber
            ? 'shrink-0 w-10 h-10 rounded-xl bg-orange-500 text-white font-semibold shadow'
            : 'shrink-0 w-10 h-10 rounded-xl border border-gray-200 hover:bg-gray-100 transition'
        "
      >
        {{ page }}
      </button>
    }

    <!-- Next Button -->
    <button
      (click)="onPageChange(pageNumber + 1)"
      [disabled]="pageNumber >= totalPages"
      class="shrink-0 px-3 sm:px-4 py-2 rounded-xl border border-gray-200 text-gray-600 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition text-sm"
    >
      <span class="hidden sm:inline">Next</span> →
    </button>
  </nav>
</div>
