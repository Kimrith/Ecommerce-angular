<aside class="flex h-screen flex-col border-r border-slate-200 bg-white">

  <!-- Logo -->
  <div class="border-b border-slate-200 px-6 py-6">
    <h1 class="text-2xl font-bold text-orange-500">
      ShopSphere
    </h1>

    <p class="mt-1 text-sm text-slate-500">
      Admin Dashboard
    </p>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto px-4 py-6">

    <p class="mb-3 px-3 text-xs font-semibold uppercase tracking-wider text-slate-400">
      Main
    </p>

    <div class="space-y-2">

      <a routerLink="/admin" routerLinkActive="bg-orange-100 text-orange-600"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-700 transition hover:bg-slate-100">
        <span>🏠</span>
        <span>Dashboard</span>
      </a>

      <a routerLink="/admin/customer" routerLinkActive="bg-orange-100 text-orange-600"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-700 transition hover:bg-slate-100">
        <span>👥</span>
        <span>Customer</span>
      </a>

      <a routerLink="/admin/sellers" routerLinkActive="bg-orange-100 text-orange-600"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-700 transition hover:bg-slate-100">
        <span>🏪</span>
        <span>Sellers</span>
      </a>

      <a routerLink="/admin/products" routerLinkActive="bg-orange-100 text-orange-600"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-700 transition hover:bg-slate-100">
        <span>📦</span>
        <span>Products</span>
      </a>

      <a routerLink="/admin/categories" routerLinkActive="bg-orange-100 text-orange-600"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-700 transition hover:bg-slate-100">
        <span>🗂️</span>
        <span>Categories</span>
      </a>

      <a routerLink="/admin/orders" routerLinkActive="bg-orange-100 text-orange-600"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-700 transition hover:bg-slate-100">
        <span>🛒</span>
        <span>Orders</span>
      </a>

      <a routerLink="/admin/payments" routerLinkActive="bg-orange-100 text-orange-600"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-700 transition hover:bg-slate-100">
        <span>💳</span>
        <span>Payments</span>
      </a>

      <a routerLink="/admin/reports" routerLinkActive="bg-orange-100 text-orange-600"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-700 transition hover:bg-slate-100">
        <span>📈</span>
        <span>Reports</span>
      </a>

      <a routerLink="/admin/settings" routerLinkActive="bg-orange-100 text-orange-600"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-700 transition hover:bg-slate-100">
        <span>⚙️</span>
        <span>Settings</span>
      </a>

    </div>

  </nav>

  <!-- Footer -->
  <div class="border-t border-slate-200 p-4">

    <button routerLink="/login"
      class="flex w-full items-center justify-center gap-2 rounded-xl bg-red-50 px-4 py-3 text-red-600 transition hover:bg-red-100">
      <span>🚪</span>
      <span>Login</span>
    </button>

  </div>

</aside>
