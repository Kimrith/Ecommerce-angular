<div class="h-screen bg-white border-r border-slate-200 p-5 flex flex-col">
  <!-- Logo -->
  <div class="mb-8">

    <h1 class="text-2xl font-bold text-orange-600">
      ShopSphere
    </h1>

    <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">
      Seller Panel
    </p>

  </div>
  <!-- Menu -->
  <nav class="flex-1">
    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest px-3 mb-3">
      Menu
    </p>
    <ul class="space-y-1">
      <!-- Dashboard -->
      <li>
        <RouterLink 
          routerLink="/sellers"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          [routerLinkActiveOptions]="{exact:true}"
          class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 hover:bg-slate-100 transition">
          <span class="material-symbols-outlined">dashboard</span>
          <span>
            Dashboard
          </span>
        </RouterLink>
      </li>

      <!-- Products -->
      <li>
        <RouterLink
          routerLink="/sellers/products"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 hover:bg-slate-100 transition">
          <span class="material-symbols-outlined">inventory_2</span>
          <span>Products</span>
        </RouterLink>
      </li>
      <!-- Categories -->
      <li>
        <RouterLink
          routerLink="/sellers/categories"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 hover:bg-slate-100 transition">
          <span class="material-symbols-outlined">category</span>
          <span>Categories</span>
        </RouterLink>
      </li>
      <!-- Orders -->
      <li>
        <RouterLink
          routerLink="/sellers/orders"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 hover:bg-slate-100 transition">
          <span class="material-symbols-outlined">shopping_cart</span>
          <span>Orders</span>
        </RouterLink>
      </li>
      <!-- FeedBack -->
      <li>
        <RouterLink
          routerLink="/sellers/feedback"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 hover:bg-slate-100 transition">
          <span class="material-symbols-outlined">reviews</span>
          <span>FeedBack</span>
        </RouterLink>
      </li>
      <!-- Users -->
      <li>
        <RouterLink
          routerLink="/sellers/setting"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 hover:bg-slate-100 transition">
          <span class="material-symbols-outlined">settings</span>
          <span>Setting</span>
        </RouterLink>
      </li>
      <!-- Payments -->
      <li>
        <RouterLink
          routerLink="/sellers/payments"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 hover:bg-slate-100 transition">
          <span class="material-symbols-outlined">payments</span>
          <span>Payments</span>
        </RouterLink>
      </li>
    </ul>
  </nav>
  <!-- Bottom -->
  <div class="border-t border-slate-200 pt-4">
    <RouterLink
      routerLink="/"
      class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 hover:bg-slate-100 transition">
      <span class="material-symbols-outlined">arrow_back</span>
      <span>Back To Store</span>
    </RouterLink>
    <button
      class="flex w-full mt-2 items-center gap-3 px-3 py-3 rounded-xl text-red-500 hover:bg-red-50 transition">
      <span class="material-symbols-outlined">logout</span>
      <span>Logout</span>
    </button>
  </div>
</div>
