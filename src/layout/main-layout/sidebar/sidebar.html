<aside class="space-y-6 font-sans">

  <!-- Page Navigation -->
  <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xl shadow-slate-200/50">

    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 px-2">
      Navigation
    </h3>

    <ul class="space-y-1 text-sm text-slate-600">

      <!-- Home -->
      <li>
        <a
          routerLink="/"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center justify-between py-2 px-3 rounded-xl transition-all hover:bg-slate-100 hover:text-slate-900">

          Home

        </a>
      </li>


      <!-- About -->
      <li>
        <a
          routerLink="/about"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center justify-between py-2 px-3 rounded-xl transition-all hover:bg-slate-100 hover:text-slate-900">

          About

        </a>
      </li>


      <!-- Contact -->
      <li>
        <a
          routerLink="/contact"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center justify-between py-2 px-3 rounded-xl transition-all hover:bg-slate-100 hover:text-slate-900">

          Contact

        </a>
      </li>


      <!-- Setting -->
      <li>
        <a
          routerLink="/setting"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center justify-between py-2 px-3 rounded-xl transition-all hover:bg-slate-100 hover:text-slate-900">

          Setting

        </a>
      </li>


      <!-- Payment Method -->
      <li>
        <a
          routerLink="/paymentmethod"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center justify-between py-2 px-3 rounded-xl transition-all hover:bg-slate-100 hover:text-slate-900">

          Payment Method

        </a>
      </li>


      <!-- Orders -->
      <li>
        <a
          routerLink="/orders"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center justify-between py-2 px-3 rounded-xl transition-all hover:bg-slate-100 hover:text-slate-900">

          Orders

        </a>
      </li>


      <!-- Register -->
      <li>
        <a
          routerLink="/auth/register"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center justify-between py-2 px-3 rounded-xl transition-all hover:bg-slate-100 hover:text-slate-900">

          Register

        </a>
      </li>

    </ul>

  </div>

  <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xl shadow-slate-200/50">
    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 px-2">
      Categories
    </h3>

    <ul class="space-y-1 text-sm text-slate-600">

      <!-- All Products -->
      <li>
        <a
          routerLink="/products"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center justify-between py-2 px-3 rounded-xl transition-all hover:bg-slate-100 hover:text-slate-900">

          All Products

        </a>
      </li>


      <!-- Electronics -->
      <li>
        <a
          [routerLink]="['/categories', 1]"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center justify-between py-2 px-3 rounded-xl transition-all hover:bg-slate-100 hover:text-slate-900">

          Electronics & Gadgets

        </a>
      </li>


      <!-- Fashion -->
      <li>
        <a
          [routerLink]="['/categories', 2]"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center justify-between py-2 px-3 rounded-xl transition-all hover:bg-slate-100 hover:text-slate-900">

          Apparel & Fashion

        </a>
      </li>


      <!-- Home -->
      <li>
        <a
          [routerLink]="['/categories', 3]"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center justify-between py-2 px-3 rounded-xl transition-all hover:bg-slate-100 hover:text-slate-900">

          Home & Kitchen

        </a>
      </li>


      <!-- Sports -->
      <li>
        <a
          [routerLink]="['/categories', 4]"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center justify-between py-2 px-3 rounded-xl transition-all hover:bg-slate-100 hover:text-slate-900">

          Sports & Outdoors

        </a>
      </li>


      <!-- Beauty -->
      <li>
        <a
          [routerLink]="['/categories', 5]"
          routerLinkActive="bg-orange-50 text-orange-600 font-semibold"
          class="flex items-center justify-between py-2 px-3 rounded-xl transition-all hover:bg-slate-100 hover:text-slate-900">

          Beauty & Health

        </a>
      </li>

    </ul>
  </div>

  <!-- Price Range Filter -->
  <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xl shadow-slate-200/50">
    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 px-2">Price Range</h3>
    <div class="space-y-4 px-2">
      <input type="range" min="0" max="1000" class="w-full accent-orange-500 bg-slate-100 cursor-pointer h-2 rounded-lg">
      <div class="flex items-center justify-between text-xs text-slate-500 font-semibold">
        <span class="px-2 py-1 rounded bg-slate-100 border border-slate-200">$0</span>
        <span class="px-2 py-1 rounded bg-slate-100 border border-slate-200">$1,000+</span>
      </div>
    </div>
  </div>
</aside>
