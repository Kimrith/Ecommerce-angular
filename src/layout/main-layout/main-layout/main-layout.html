<!-- Navbar -->
<app-navbar
  (toggleSidebarMobile)="toggleSidebar()">
</app-navbar>
<div class="min-h-screen bg-gray-50">
  <!-- Mobile Sidebar -->
  @if (isSidebarOpen) {
    <div class="fixed inset-0 z-50 lg:hidden flex">
      <!-- Overlay -->
      <div
        class="fixed inset-0 bg-black/50"
        (click)="toggleSidebar()">
      </div>
      <!-- Sidebar -->
      <aside
        class="
        relative
        w-[85%]
        max-w-sm
        h-full
        bg-white
        p-5
        shadow-xl
        z-10
        overflow-y-auto
        ">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-lg font-bold">
            Filters
          </h2>
          <button
            class="
            w-8 h-8
            rounded-full
            hover:bg-gray-100
            text-gray-600
            "
            (click)="toggleSidebar()">
            ✕
          </button>
        </div>
        <app-sidebar></app-sidebar>
      </aside>
    </div>
  }
  <!-- Content -->
  <div
    class="
    mx-auto
    px-4
    sm:px-6
    lg:px-8
    py-5
    sm:py-8
    ">
    <div
      class="
      flex
      flex-col
      lg:flex-row
      gap-5
      lg:gap-8
      ">
      <!-- Desktop Sidebar -->
      <aside
        class="
        hidden
        lg:block
        w-72
        flex-shrink-0
        ">
        <div
          class="
          sticky
          top-24
          bg-white
          rounded-2xl
          border
          border-gray-200
          shadow-sm
          p-6
          ">
          <h3 class="text-lg font-bold mb-5">
            Filters
          </h3>
          <app-sidebar></app-sidebar>
        </div>
      </aside>
      <!-- Page -->
      <main class="flex-1 min-w-0">
        <div
          class="
          bg-white
          rounded-2xl
          border
          border-gray-200
          shadow-sm
          p-4
          sm:p-6
          lg:p-8
          ">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </div>
</div>
<!-- Footer -->
<app-footer></app-footer>
